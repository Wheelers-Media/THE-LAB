<!-- Truck selector modal: single source of truth. tools/sync_chrome.py copies this into every store page; vehicle-selector.js drives it. -->
<!-- Vehicle Selector Modal -->
    <div id="vehicle-selector-modal" role="dialog" aria-modal="true" aria-label="Select your truck" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm px-4">
        <div class="bg-[#12121A] border border-edge rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="p-6 border-b border-edge flex items-start justify-between">
                <div>
                    <h2 class="font-heading font-extrabold text-xl text-white uppercase tracking-tight">Personalized Part Navigation</h2>
                    <p class="text-sm text-zinc-400 mt-1">Choose your truck and we'll only show you part categories for your selection on this browser.</p>
                </div>
                <button type="button" id="close-vs-modal" class="text-zinc-500 hover:text-white transition-colors w-12 h-12 flex items-center justify-center rounded-lg hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-labBlue" aria-label="Close modal">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto">
                <!-- Step 1 -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xs font-bold text-white uppercase tracking-widest">Step 1 - Select Make</h3>
                        <button type="button" id="vs-reset" class="text-xs text-zinc-400 hover:text-white border border-edge hover:border-zinc-500 rounded-lg px-4 py-3 uppercase tracking-wider transition-all flex items-center justify-center gap-2 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-labBlue">
                            Reset
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-6" id="vs-make-grid">
                        <button type="button" data-make="Cummins" class="vs-make-btn flex flex-col items-center justify-center p-8 border border-edge rounded-xl bg-[#0D0D12] transition-all group">
                            <img width="2500" height="2250" src="/assets/ram-logo.png" alt="" class="h-16 w-auto mb-4 object-contain vs-make-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <span class="hidden text-zinc-500 mb-2">Ram</span>
                            <span class="text-xs font-bold text-zinc-500 uppercase tracking-widest transition-colors vs-make-text group-hover:text-white">Cummins</span>
                        </button>
                        <button type="button" data-make="Duramax" class="vs-make-btn flex flex-col items-center justify-center p-8 border border-edge rounded-xl bg-[#0D0D12] transition-all group">
                            <img width="394" height="394" src="/assets/gm-logo.png" alt="" class="h-16 w-auto mb-4 object-contain vs-make-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <span class="hidden text-zinc-500 mb-2">GM</span>
                            <span class="text-xs font-bold text-zinc-500 uppercase tracking-widest transition-colors vs-make-text group-hover:text-white">Duramax</span>
                        </button>
                        <button type="button" data-make="Powerstroke" class="vs-make-btn flex flex-col items-center justify-center p-8 border border-edge rounded-xl bg-[#0D0D12] transition-all group">
                            <img width="1004" height="362" src="/assets/ford-logo.png" alt="" class="h-16 w-auto mb-4 object-contain vs-make-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <span class="hidden text-zinc-500 mb-2">Ford</span>
                            <span class="text-xs font-bold text-zinc-500 uppercase tracking-widest transition-colors vs-make-text group-hover:text-white">Powerstroke</span>
                        </button>
                        <button type="button" data-make="Half-Ton" class="vs-make-btn flex flex-col items-center justify-center p-8 border border-edge rounded-xl bg-[#0D0D12] transition-all group">
                            <img width="540" height="360" src="/assets/half-ton.png" alt="" class="h-16 w-auto mb-4 object-contain vs-make-icon brightness-0 invert" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <span class="text-xs font-bold text-zinc-500 uppercase tracking-widest transition-colors vs-make-text group-hover:text-white">Half-Ton</span>
                        </button>
                    </div>
                </div>
                
                <!-- Step 2 -->
                <div id="vs-step-2" inert class="opacity-30 pointer-events-none transition-all duration-300">
                    <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-4">Step 2 - Select Engine</h3>
                    <div class="relative w-full md:w-1/2 mb-8">
                        <select aria-label="Engine" id="vs-engine-select" class="w-full appearance-none bg-[#000000] border border-edge rounded-xl p-4 pr-12 text-sm text-white focus:outline-none focus:border-labBlue focus:ring-2 focus:ring-labBlue/50 shadow-oled-blue transition-all cursor-pointer min-h-[48px]">
                            <option value="">Select Engine</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button type="button" id="vs-submit" disabled class="bg-zinc-700 text-zinc-400 font-bold px-6 py-3.5 rounded-xl text-sm transition-all uppercase tracking-wider cursor-not-allowed min-h-[48px] focus:outline-none focus:ring-2 focus:ring-labBlue">Select Truck</button>
                        <button type="button" id="vs-cancel" class="border border-edge text-white font-bold px-6 py-3.5 rounded-xl text-sm hover:bg-white/5 transition-all uppercase tracking-wider min-h-[48px] focus:outline-none focus:ring-2 focus:ring-labBlue">Cancel</button>
                    </div>
                    
                    <p class="text-xs text-zinc-400 mt-6">Can't find your vehicle? <a href="/contact/" class="text-white hover:underline">Contact us</a> to order parts directly.</p>
                </div>
            </div>
        </div>
    </div>
<!--if:tuning-->
<script>window.isTuningPortal = true;</script>
<!--/if:tuning-->
