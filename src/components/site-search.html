<!-- Site search overlay: single source of truth. tools/sync_chrome.py copies this into every page. global-search.js drives it. -->
<div id="global-search-overlay" class="site-search" role="dialog" aria-modal="true" aria-label="Search the site">
    <div class="site-search-top">
        <div class="site-search-box">
            <label class="sr-only" for="global-search-input">Search parts and services</label>
            <input type="search" id="global-search-input" placeholder="Search parts, services, tuning, detailing..." autocomplete="off">
            <button type="button" id="global-search-submit" class="site-search-go">Search</button>
        </div>
        <button type="button" class="site-icon site-search-x" onclick="toggleGlobalSearch()" aria-label="Close search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="global-search-suggestions" class="site-search-list hidden" role="listbox" aria-label="Suggestions"></div>
    <p class="site-search-hint">Try &ldquo;Powerstroke tune&rdquo;, &ldquo;window tint&rdquo; or &ldquo;Duramax exhaust&rdquo;.</p>
</div>
